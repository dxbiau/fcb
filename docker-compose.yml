# ═══════════════════════════════════════════════════════════════
# FCB Bot — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════
# Usage:
#   1. Copy .env.example → .env and fill in your API keys
#   2. docker-compose up -d
#   3. docker-compose logs -f    (watch output)
#   4. docker-compose down       (stop)
#
# Dashboard: http://<server-ip>:8080/
# ═══════════════════════════════════════════════════════════════

services:
  fcb-bot:
    build: .
    container_name: fcb-bot
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      # Persist state, trades, and logs across container restarts
      - fcb-logs:/app/live/logs
      # Bind-mount for easy access to trade CSV, state JSON, and JSONL
      - ./live/state.json:/app/live/state.json
      - ./live/trades.csv:/app/live/trades.csv

    # Memory limit — bot is lightweight, no need for more
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # Graceful shutdown — give the bot time to close positions cleanly
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Dashboard (read-only performance tracker) ──
  # Separate container — does NOT interact with bot process.
  # Reads from shared volumes only.
  dashboard:
    build: .
    container_name: fcb-dashboard
    restart: unless-stopped
    entrypoint: ["python", "dashboard.py"]
    command: []

    ports:
      - "8080:8080"

    environment:
      - DASHBOARD_PORT=8080
      - PYTHONUNBUFFERED=1

    volumes:
      # Read-write access to bot control file + read logs/state
      - fcb-logs:/app/live/logs
      - ./live/state.json:/app/live/state.json:ro

    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fcb-logs:
